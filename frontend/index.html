<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover — AI Negotiation Agent</title>
<style>
  :root {
    --ink: #101826;
    --ink-soft: #2A3547;
    --paper: #F4F2EC;
    --panel: #FFFFFF;
    --line: #DDD9CE;
    --gold: #B8863A;
    --gold-soft: #EFE3CB;
    --green: #3E7B5B;
    --green-soft: #E1EEE6;
    --red: #A8453A;
    --red-soft: #F4E2DF;
    --muted: #7A7568;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    min-height: 100vh;
  }

  @font-face {
    font-family: 'IBM Plex Sans';
    src: local('Arial');
  }

  header {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .brand {
    font-family: 'Source Serif Pro', Georgia, serif;
    font-size: 26px;
    letter-spacing: -0.01em;
    font-weight: 600;
  }
  .brand span { color: var(--gold); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 90px);
  }

  /* ---------- LEFT PANEL ---------- */
  .left {
    border-right: 1px solid var(--line);
    padding: 28px;
    background: var(--panel);
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--paper);
    color: var(--ink);
  }

  .btn {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: none;
    border-radius: 4px;
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: var(--ink-soft); }

  .plans-block { margin-top: 28px; }

  .plan-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    transition: opacity 0.3s;
  }
  .plan-row.rejected { opacity: 0.35; }
  .plan-row.offered .plan-name { color: var(--gold); }

  .plan-top {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .plan-name { font-weight: 600; }
  .plan-prob { color: var(--green); font-weight: 600; }

  .bar-track {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .plan-row.offered .bar-fill { background: var(--gold); }
  .plan-row.rejected .bar-fill { background: var(--red); }

  .plan-desc {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  .empty-note {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
  }

  /* ---------- RIGHT PANEL (CHAT) ---------- */
  .right {
    display: flex;
    flex-direction: column;
    padding: 28px 40px;
  }

  .chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 640px;
  }

  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .msg.customer {
    align-self: flex-end;
    background: var(--ink);
    color: var(--paper);
    border-bottom-right-radius: 2px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 2px;
  }
  .msg.escalate {
    align-self: flex-start;
    background: var(--red-soft);
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
  }

  .plan-tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 8px;
    background: var(--gold-soft);
    color: var(--gold);
    border-radius: 4px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }

  .input-row {
    display: flex;
    gap: 10px;
    max-width: 640px;
    margin-top: 8px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    background: var(--panel);
  }
  .input-row button {
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    background: var(--ink);
    color: var(--paper);
    font-weight: 600;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: var(--muted);
    cursor: not-allowed;
  }

  .typing {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    padding-left: 4px;
  }

  .status-bar {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }
  .dot.down { background: var(--red); }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Re<span>cover</span></div>
    <div class="subtitle">AI Negotiation Agent for Payment Settlements — demo console</div>
  </div>
  <div class="subtitle" id="apiStatus">checking backend…</div>
</header>

<div class="layout">
  <!-- LEFT: customer profile + live plan scoring -->
  <div class="left">
    <div class="section-label">Customer Profile</div>

    <div class="field">
      <label>Amount owed (Rs.)</label>
      <input type="number" id="amount_owed" value="8500">
    </div>
    <div class="field">
      <label>Days overdue</label>
      <input type="number" id="days_overdue" value="25">
    </div>
    <div class="field">
      <label>Past defaults</label>
      <input type="number" id="past_default_count" value="1">
    </div>
    <div class="field">
      <label>Historical on-time rate (0–1)</label>
      <input type="number" step="0.05" id="past_ontime_pct" value="0.6">
    </div>
    <div class="field">
      <label>Reminder open rate (0–1)</label>
      <input type="number" step="0.05" id="reminder_open_rate" value="0.4">
    </div>
    <div class="field">
      <label>Reason for default</label>
      <select id="reason_code">
        <option value="EMI_FAIL">EMI failure</option>
        <option value="SUB_LAPSE">Subscription lapse</option>
        <option value="B2B_INVOICE">B2B invoice overdue</option>
        <option value="CARD_EXPIRED">Card expired</option>
        <option value="DISPUTE">Customer dispute</option>
      </select>
    </div>

    <button class="btn" onclick="loadCustomer()">Load Customer &amp; Score Plans</button>

    <div class="plans-block">
      <div class="section-label">Recovery Probability by Plan</div>
      <div id="plansContainer"><p class="empty-note">Load a customer to see ranked plans.</p></div>
    </div>
  </div>

  <!-- RIGHT: chat negotiation -->
  <div class="right">
    <div class="status-bar"><span class="dot" id="convDot"></span><span id="convStatus">No active conversation. Load a customer to begin.</span></div>
    <div class="chat-window" id="chatWindow"></div>
    <div class="input-row">
      <input type="text" id="customerInput" placeholder="Type as the customer… e.g. 'I can't pay it all right now'" disabled>
      <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000";
let currentCustomer = null;
let conversation = [];
let latestPlans = [];

async function checkHealth() {
  try {
    const r = await fetch(`${API_BASE}/health`);
    if (r.ok) {
      document.getElementById('apiStatus').textContent = 'backend connected';
    } else throw new Error();
  } catch {
    document.getElementById('apiStatus').textContent = 'backend not reachable — start uvicorn on :8000';
  }
}
checkHealth();

function getCustomerFromForm() {
  return {
    customer_id: "DEMO_" + Math.random().toString(36).slice(2, 7).toUpperCase(),
    amount_owed: parseFloat(document.getElementById('amount_owed').value),
    days_overdue: parseInt(document.getElementById('days_overdue').value),
    past_default_count: parseInt(document.getElementById('past_default_count').value),
    past_ontime_pct: parseFloat(document.getElementById('past_ontime_pct').value),
    reminder_open_rate: parseFloat(document.getElementById('reminder_open_rate').value),
    reason_code: document.getElementById('reason_code').value,
  };
}

function renderPlans(plans, offeredPlan, rejectedPlans) {
  const container = document.getElementById('plansContainer');
  container.innerHTML = '';
  plans.forEach(p => {
    const row = document.createElement('div');
    row.className = 'plan-row';
    if (rejectedPlans && rejectedPlans.has(p.plan)) row.classList.add('rejected');
    if (offeredPlan === p.plan) row.classList.add('offered');

    row.innerHTML = `
      <div class="plan-top">
        <span class="plan-name">${p.plan.replaceAll('_',' ')}</span>
        <span class="plan-prob">${(p.recovery_probability*100).toFixed(1)}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${(p.recovery_probability*100).toFixed(1)}%"></div></div>
      <div class="plan-desc">${p.plan_description}</div>
    `;
    container.appendChild(row);
  });
}

async function loadCustomer() {
  currentCustomer = getCustomerFromForm();
  conversation = [];
  document.getElementById('chatWindow').innerHTML = '';

  try {
    const r = await fetch(`${API_BASE}/score-plans`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(currentCustomer)
    });
    const data = await r.json();
    latestPlans = data.scores;
    renderPlans(latestPlans, null, new Set());

    document.getElementById('convStatus').textContent =
      `Negotiating with ${currentCustomer.customer_id} — Rs.${currentCustomer.amount_owed} overdue`;
    document.getElementById('convDot').classList.remove('down');
    document.getElementById('customerInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;

    addMessage('agent', `Hi, this is regarding your overdue payment of Rs.${currentCustomer.amount_owed}. I'd like to work out a plan that suits you — what's your situation?`);
    conversation.push({role: 'agent', content: `Hi, this is regarding your overdue payment of Rs.${currentCustomer.amount_owed}. I'd like to work out a plan that suits you — what's your situation?`});
  } catch (e) {
    document.getElementById('convStatus').textContent = 'Failed to reach backend.';
    document.getElementById('convDot').classList.add('down');
  }
}

function addMessage(role, text, planTag) {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = text.replace(/\n/g, '<br>');
  if (planTag) {
    const tag = document.createElement('div');
    tag.className = 'plan-tag';
    tag.textContent = planTag.replaceAll('_', ' ');
    div.appendChild(tag);
  }
  win.appendChild(div);
  win.scrollTop = win.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('customerInput');
  const text = input.value.trim();
  if (!text || !currentCustomer) return;

  addMessage('customer', text);
  conversation.push({role: 'customer', content: text});
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  const win = document.getElementById('chatWindow');
  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = 'Agent is typing…';
  win.appendChild(typingEl);
  win.scrollTop = win.scrollHeight;

  try {
    const r = await fetch(`${API_BASE}/negotiate`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        customer: currentCustomer,
        conversation: conversation.slice(0, -1),
        customer_message: text
      })
    });
    const data = await r.json();
    typingEl.remove();

    if (data.escalated) {
      addMessage('escalate', `⚠ Escalated to human agent — ${data.escalation_reason || 'requires manual review'}`);
      document.getElementById('convStatus').textContent = 'Escalated to human — conversation paused';
      document.getElementById('convDot').classList.add('down');
      document.getElementById('customerInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
    } else {
      addMessage('agent', data.agent_reply, data.offered_plan);
      conversation.push({role: 'agent', content: data.agent_reply, offered_plan: data.offered_plan});
      document.getElementById('sendBtn').disabled = false;
    }

    // recompute rejected set for visualization: anything offered before that customer just declined
    const rejected = new Set();
    for (let i = 0; i < conversation.length - 1; i++) {
      if (conversation[i].role === 'agent' && conversation[i].offered_plan) {
        const next = conversation[i+1];
        if (next && next.role === 'customer' && /no|can't|cannot|won't|too much|still tough/i.test(next.content)) {
          rejected.add(conversation[i].offered_plan);
        }
      }
    }
    renderPlans(data.plans_considered && data.plans_considered.length ? data.plans_considered : latestPlans, data.offered_plan, rejected);

  } catch (e) {
    typingEl.remove();
    addMessage('escalate', 'Could not reach the negotiation backend. Is uvicorn running on :8000?');
    document.getElementById('sendBtn').disabled = false;
  }
}

document.getElementById('customerInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
